name: Deploy web demo to GitHub Pages

# Esporta l'app Expo per il web e la pubblica sul branch gh-pages
# (servito da GitHub Pages su https://tobiaseu.github.io/fanta.me/).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo export --platform web
      # SPA su GitHub Pages: i deep link (/game/...) ricadono su index.html
      - run: cp dist/index.html dist/404.html && touch dist/.nojekyll
      - name: Pubblica su gh-pages
        run: |
          cd dist
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
